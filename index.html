<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BARBER HOUSE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>
<body>

  <!-- Encabezado -->
  <header class="site-header">
    <div class="header-inner">
      <a href="#home" class="brand">BARBER HOUSE</a>
      <nav class="nav-menu">
        <a href="#home">Inicio</a>
        <a href="#servicios">Servicies</a>
        <a href="#reservar">Reservar</a>
        <a href="#contacto">Contacto</a>
      </nav>
    </div>
    <div class="red-line"></div>
  </header>

  <main>
    <!-- Hero Section -->
    <section class="hero" id="home">
      <div class="hero-content">
        <h1>DÍA DE CORTE</h1>
        <p class="hero-subtitle">BARBERÍA Y ESTILO</p>
      </div>
      <div class="red-line"></div>
    </section>

    <!-- Sección de Servicios -->
    <section class="services-section" id="servicios">
      <div class="divider-title">
        <span>Nuestros Servicios</span>
      </div>

      <div class="services-row">
        <!-- Corte -->
        <div class="service-item" data-service="Corte">
          <div class="service-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="6" cy="6" r="3"/>
              <circle cx="6" cy="18" r="3"/>
              <line x1="20" y1="4" x2="8.12" y2="15.88"/>
              <line x1="14.47" y1="14.48" x2="20" y2="20"/>
              <line x1="8.12" y1="8.12" x2="12" y2="12"/>
            </svg>
          </div>
          <p class="service-name">Corte</p>
        </div>

        <!-- Barba -->
        <div class="service-item" data-service="Barba">
          <div class="service-icon">
            <svg viewBox="0 0 24 24" fill="currentColor">
              <path d="M12 2a5 5 0 00-5 5v3a5 5 0 0010 0V7a5 5 0 00-5-2zm-3 8V7a3 3 0 016 0v3a3 3 0 01-6 0z"/>
              <path d="M12 13a7 7 0 01-7-7 1 1 0 00-2 0 9 9 0 009 9 9 9 0 009-9 1 1 0 00-2 0 7 7 0 01-7 7z"/>
            </svg>
          </div>
          <p class="service-name">Barba</p>
        </div>

        <!-- Fade -->
        <div class="service-item" data-service="Fade">
          <div class="service-icon">
            <svg viewBox="0 0 24 24" fill="currentColor">
              <path d="M12 3c-4.97 0-9 4.03-9 9 0 2.12.74 4.07 1.97 5.61L4.35 19.4a1 1 0 001.25 1.25l1.79-.62A8.94 8.94 0 0012 21c4.97 0 9-4.03 9-9s-4.03-9-9-9zm0 16a7 7 0 110-14 7 7 0 010 14z"/>
            </svg>
          </div>
          <p class="service-name">Fade</p>
        </div>

        <!-- Diseño -->
        <div class="service-item" data-service="Diseño">
          <div class="service-icon">
            <svg viewBox="0 0 24 24" fill="currentColor">
              <path d="M20.71 5.63l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-3.12 3.12-1.93-1.91-1.41 1.41 1.42 1.42-7.09 7.09c-.39.39-.39 1.02 0 1.41l2.34 2.34c.39.39 1.02.39 1.41 0l7.09-7.09 1.42 1.42 1.41-1.41-1.91-1.93 3.12-3.12c.4-.39.4-1.03 0-1.42z"/>
            </svg>
          </div>
          <p class="service-name">Diseño</p>
        </div>
      </div>

      <!-- Botón de Reserva -->
<div class="cta-wrap" id="reservar">
  <button type="button" class="btn-red" id="btnReservar" onclick="enviarWhatsApp()">Reservar cita</button>
</div>
    </section>
  </main>

</body>
</html>
